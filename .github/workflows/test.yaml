name: print_name
 
on:
    workflow_dispatch:
    push:
      branches:
        - feature-*

jobs:
   android:
     timeout-minutes: 30
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v4
 
       - name: Determine env
         id: determine_env
         run: echo "PROFILE=$(echo $GITHUB_REF | cut -d'/' -f3)" >> $GITHUB_ENV
 
       - name: print env
         run: echo "${{ env.PROFILE }}"
